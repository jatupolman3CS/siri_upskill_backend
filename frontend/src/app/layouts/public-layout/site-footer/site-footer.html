<footer class="border-t border-[var(--color-border)] bg-[var(--color-surface)]">
  <div class="mx-auto flex max-w-6xl flex-col items-center gap-2 px-4 py-8 text-center">
    <span class="text-base font-bold text-[var(--color-primary)]">{{ 'common.appName' | translate }}</span>
    <p class="max-w-md text-sm text-[var(--color-text-muted)]">{{ 'footer.tagline' | translate }}</p>
    <p class="text-xs text-[var(--color-text-muted)]">{{ 'footer.copyright' | translate: { year: year } }}</p>
  </div>
</footer>
