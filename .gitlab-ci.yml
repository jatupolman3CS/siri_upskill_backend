# GitLab CI pipeline (task P0-07) — backend repo.
# แยกออกมาจาก .gitlab-ci.yml ของ monorepo ตอนแยก repo (2026-08-25): job "frontend" ย้ายไปอยู่ที่
# siri_upskill_ui แล้ว, job "backend"/"secret-scan" อยู่ที่นี่ และ path ทั้งหมดตัด prefix "backend/" ออก
# เพราะโค้ด backend อยู่ที่ root ของ repo นี้แล้ว
# gate เดิมทุกอย่าง: build → unit → architecture → integration (Testcontainers) → dependency scan → secret scan
# ต้องใช้ gitlab.com shared runner (docker executor ที่อนุญาต docker:dind) — self-managed runner ต้องเปิด
# privileged/dind ไม่งั้น Testcontainers ของ job backend จะรันไม่ได้

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - verify

backend:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:10.0
  timeout: 45m
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - dotnet restore SiriUpSkill.sln
    - dotnet build SiriUpSkill.sln --no-restore --configuration Release
    - dotnet test tests/Siri.UnitTests/Siri.UnitTests.csproj --no-build --configuration Release
    - dotnet test tests/Siri.ArchitectureTests/Siri.ArchitectureTests.csproj --no-build --configuration Release
    - dotnet test tests/Siri.IntegrationTests/Siri.IntegrationTests.csproj --no-build --configuration Release
    # security.md §5: dependency scanning fails the build on high+ severity.
    - |
      output=$(dotnet list SiriUpSkill.sln package --vulnerable --include-transitive)
      echo "$output"
      if echo "$output" | grep -Eq '\b(High|Critical)\b'; then
        echo "Vulnerable NuGet dependencies of High/Critical severity found." >&2
        exit 1
      fi

secret-scan:
  stage: verify
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  timeout: 15m
  variables:
    # Full clone — a secret committed then deleted is still leaked, so scan every commit.
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose
