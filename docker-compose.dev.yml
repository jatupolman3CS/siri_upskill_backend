# Isolated local stack. Requires Compose 2.24.4+ for !reset and !override.
# No production env file is loaded. Credentials below are local-only sample values.
name: siriupskill-dev

x-dev-environment: &dev-environment
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=SIRIUPSKILL;Username=siriupskill_app;Password=LOCAL_ONLY_database_password
  Redis__ConnectionString: redis:6379,password=LOCAL_ONLY_redis_password,abortConnect=false
  Seo__PublicBaseUrl: http://localhost:8080
  Cors__AllowedOrigins__0: http://localhost:8080
  Identity__EmailConfirmation__ConfirmEmailUrl: http://localhost:8080/confirm-email
  Identity__PasswordReset__ResetPasswordUrl: http://localhost:8080/reset-password
  Identity__Seed__AdminEmail: admin@example.test
  Identity__Seed__AdminPassword: LocalOnlyAdmin123!
  Identity__Seed__TestUserPassword: LocalOnlyLearner123!
  Email__Provider: Smtp
  Email__Smtp__Host: mailpit
  Email__Smtp__Port: "1025"
  Email__Smtp__FromAddress: no-reply@example.test
  Email__Smtp__UseStartTls: "false"
  Email__Smtp__AllowInsecure: "true"
  Payment__Stripe__SecretKey: ${SIRI_DEV_STRIPE_SECRET_KEY:-CHANGE_ME_DEV_ONLY_sk_test_placeholder_key}
  Payment__Stripe__PublishableKey: ${SIRI_DEV_STRIPE_PUBLISHABLE_KEY:-CHANGE_ME_DEV_ONLY_pk_test_placeholder_key}
  Payment__Stripe__WebhookSecret: ${SIRI_DEV_STRIPE_WEBHOOK_SECRET:-CHANGE_ME_DEV_ONLY_whsec_placeholder_key}
  VideoProvider__LibraryId: ${SIRI_DEV_VIDEO_LIBRARY_ID:-000000}
  VideoProvider__ApiKey: ${SIRI_DEV_VIDEO_API_KEY:-CHANGE_ME_DEV_ONLY_bunny_api_key}
  VideoProvider__ReadOnlyApiKey: ${SIRI_DEV_VIDEO_READONLY_API_KEY:-CHANGE_ME_DEV_ONLY_bunny_readonly_api_key}
  VideoProvider__PullZone: ${SIRI_DEV_VIDEO_PULL_ZONE:-CHANGE_ME_DEV_ONLY_pull_zone}
  VideoProvider__CdnHostname: ${SIRI_DEV_VIDEO_CDN_HOSTNAME:-}
  VideoProvider__TokenAuthenticationKey: ${SIRI_DEV_VIDEO_TOKEN_KEY:-}

services:
  postgres:
    extends:
      file: docker-compose.prod.yml
      service: postgres
    environment:
      POSTGRES_PASSWORD: LOCAL_ONLY_postgres_admin_password
      SIRI_DATABASE_PASSWORD: LOCAL_ONLY_database_password
    ports: ["127.0.0.1:5433:5432"]

  redis:
    extends:
      file: docker-compose.prod.yml
      service: redis
    environment:
      REDISCLI_AUTH: LOCAL_ONLY_redis_password
    command: ["redis-server", "--requirepass", "LOCAL_ONLY_redis_password", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]

  migrate:
    extends:
      file: docker-compose.prod.yml
      service: migrate
    env_file: !reset []
    environment: *dev-environment

  seed:
    extends:
      file: docker-compose.prod.yml
      service: migrate
    command: ["--seed"]
    env_file: !reset []
    environment: *dev-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    extends:
      file: docker-compose.prod.yml
      service: api
    env_file: !reset []
    environment: *dev-environment
    ports: ["127.0.0.1:5190:5000"]
    depends_on:
      seed:
        condition: service_completed_successfully

  workers:
    extends:
      file: docker-compose.prod.yml
      service: workers
    env_file: !reset []
    environment: *dev-environment
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  angular-ssr:
    extends:
      file: docker-compose.prod.yml
      service: angular-ssr
    environment:
      NG_ALLOWED_HOSTS: localhost

  caddy:
    extends:
      file: docker-compose.prod.yml
      service: caddy
    ports: !override ["127.0.0.1:8080:80"]
    volumes: !override
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro

  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks: [siri-net]

volumes:
  postgres_data:
  redis_data:

networks:
  siri-net:
    driver: bridge
