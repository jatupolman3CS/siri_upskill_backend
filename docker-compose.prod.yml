services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - siri-net
    depends_on:
      - angular-ssr
      - api

  angular-ssr:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NG_TRUST_PROXY_HEADERS=true
      - API_INTERNAL_URL=http://api:5000
    networks:
      - siri-net
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/src/Siri.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - siri-net
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: backend/src/Siri.Workers/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - siri-net
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - siri-net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siri-net

volumes:
  caddy_data:
  caddy_config:
  mssql_data:
  redis_data:

networks:
  siri-net:
    driver: bridge
