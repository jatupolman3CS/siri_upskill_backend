services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - siri-net
    depends_on:
      - angular-ssr
      - api

  angular-ssr:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NG_TRUST_PROXY_HEADERS=true
      - API_INTERNAL_URL=http://api:5000
    networks:
      - siri-net
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/src/Siri.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - siri-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: backend/src/Siri.Workers/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - siri-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # Task P0-41 replaced SQL Server with PostgreSQL 17.
    # POSTGRES_DB is UPPERCASE on purpose: the database really is named SIRIUPSKILL, and the value is
    # passed to initdb as a parameter rather than as SQL, so it needs no quoting here. Anywhere it
    # appears inside actual SQL it must be written "SIRIUPSKILL" — PostgreSQL folds unquoted
    # identifiers to lower case.
    # POSTGRES_PASSWORD comes from .env.production (never committed), same as every other secret here.
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=SIRIUPSKILL
      - POSTGRES_USER=siriupskill_app
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siriupskill_app -d SIRIUPSKILL || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - siri-net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siri-net

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  siri-net:
    driver: bridge
