# Run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
name: siriupskill

x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=SIRIUPSKILL;Username=siriupskill_app;Password="${SIRI_DATABASE_PASSWORD:?Set SIRI_DATABASE_PASSWORD}"'
  Redis__ConnectionString: 'redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD},abortConnect=false'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-siriupskill.siristudiophoto.com}
      API_ADDRESS: ${API_ADDRESS:-api-siriupskill.siristudiophoto.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@siriupskill.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [siri-net]
    depends_on:
      angular-ssr:
        condition: service_started
      api:
        condition: service_healthy

  angular-ssr:
    build:
      context: ../siri_upskill_ui
      dockerfile: Dockerfile.ssr
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      NG_TRUST_PROXY_HEADERS: "true"
      NG_ALLOWED_HOSTS: ${SITE_ADDRESS:-siriupskill.siristudiophoto.com}
      API_INTERNAL_URL: http://api:5000
    networks: [siri-net]
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: siriupskill-api:local
    build:
      context: .
      dockerfile: src/Siri.Api/Dockerfile
    command: ["--migrate"]
    restart: "no"
    env_file: [.env.production]
    environment: *app-environment
    networks: [siri-net]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: siriupskill-api:local
    build:
      context: .
      dockerfile: src/Siri.Api/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      <<: *app-environment
      ASPNETCORE_URLS: http://+:5000
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [siri-net]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: src/Siri.Workers/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment: *app-environment
    networks: [siri-net]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: SIRIUPSKILL
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=th-TH --encoding=UTF8
      SIRI_DATABASE_PASSWORD: ${SIRI_DATABASE_PASSWORD:?Set SIRI_DATABASE_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-siri.sh:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SIRIUPSKILL"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [siri-net]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [siri-net]

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  siri-net:
    driver: bridge
